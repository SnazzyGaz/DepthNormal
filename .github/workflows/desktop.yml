# Builds the Relief Forge desktop app on GitHub's own machines.
#  - Push a tag like v2.0.1  -> Windows portable .exe + Linux AppImage and .deb, attached to a draft Release.
#  - Run it by hand (Actions tab -> Desktop build -> Run workflow) -> the same files as downloadable artifacts, no Release.
# Every file gets a build-provenance attestation: proof it was built here, from this repo, at that commit.
# Check a download with:  gh attestation verify <file> --repo SnazzyGaz/DepthNormal
name: Desktop build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: desktop/dist/*.exe
          - os: ubuntu-latest
            target: linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # no CUDA download on Linux: there the app uses WebGPU, then the CPU

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build
        run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.files }}

      - uses: actions/upload-artifact@v4
        with:
          name: relief-forge-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
